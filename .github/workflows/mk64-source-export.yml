name: mk64-source-export

on:
  push:
    branches: [ chatgpt-mk64-ncom-build ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  export-mk64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Clone official MK64 source
        run: |
          git clone --depth 1 https://github.com/n64decomp/mk64.git mk64
          rm -rf mk64/.git
          tar -czf mk64-official-source.tar.gz mk64
      - name: Upload official source archive
        uses: actions/upload-artifact@v4
        with:
          name: mk64-official-source
          path: mk64-official-source.tar.gz
          retention-days: 1
