name: mk64-source-export

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone Torch recursively
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/HarbourMasters/torch.git torch
          rm -rf torch/.git
          find torch -name .git -type f -delete || true
          tar -czf torch-source.tar.gz torch
      - name: Upload Torch archive
        uses: actions/upload-artifact@v4
        with:
          name: torch-source
          path: torch-source.tar.gz
          retention-days: 1
